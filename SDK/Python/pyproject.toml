[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-satellite-sdk"
version = "1.0.0"
description = "Reusable Python SDK for ARC Satellite applications"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "ARC" }]
dependencies = ["websockets>=12,<17"]

[project.urls]
Documentation = "https://github.com/noeldrew/arc-sat-client/tree/dev/SDK/Python"

[tool.setuptools.packages.find]
where = ["src"]
